services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      AUTH_TOKEN: ${AUTH_TOKEN:?definí AUTH_TOKEN en .env — ver apps/server/.env.example}
      RUTA_DB: /datos/organizador.sqlite3
      ORIGEN_PERMITIDO: ${ORIGEN_PERMITIDO:-http://localhost:5173}
      NODE_ENV: production
    volumes:
      - datos_organizador:/datos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  datos_organizador:
